name: CI/CD Demo 2

# Run on every push to main AND on every pull request aimed at main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: write

jobs:
  # STEP 1 - CI: run the automatic checks
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run page checks
        run: bash tests/check_page.sh

  # STEP 2 - Build the Docker container and make sure it really works
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker image
        run: docker build -t devops-demo:latest .
      - name: Start the container and check the page loads
        run: |
          docker run -d --name demo -p 8080:80 devops-demo:latest
          sleep 3
          curl -s http://localhost:8080 | grep -q "Hello, DevOps"
      - name: Log in to GitHub Container Registry (only after merge)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Save the image on GitHub (only after merge)
        if: github.event_name == 'push'
        run: |
          IMAGE=$(echo "ghcr.io/${{ github.repository_owner }}/devops-demo" | tr '[:upper:]' '[:lower:]')
          docker tag devops-demo:latest "$IMAGE:latest"
          docker tag devops-demo:latest "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"

  # STEP 3 - CD: publish the website (only after merge, never on a pull request)
  deploy:
    if: github.event_name != 'pull_request'
    needs: [test, docker]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the site folder
        run: |
          mkdir _site
          cp index.html _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
